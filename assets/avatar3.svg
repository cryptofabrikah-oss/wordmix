<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#f0f0f0" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Face -->
  <circle cx="32" cy="28" r="10" fill="#fdbcb4"/>
  
  <!-- Hair -->
  <path d="M22 20 Q32 16 42 20 Q42 24 32 22 Q22 24 22 20" fill="#228b22"/>
  <path d="M22 20 Q27 18 32 20 Q37 18 42 20 Q40 26 32 24 Q24 26 22 20" fill="#32cd32"/>
  
  <!-- Hood/Cap -->
  <path d="M24 18 Q32 14 40 18 Q40 22 32 20 Q24 22 24 18" fill="#228b22" stroke="#006400" stroke-width="1"/>
  
  <!-- Eyes -->
  <circle cx="28" cy="26" r="2" fill="#333"/>
  <circle cx="36" cy="26" r="2" fill="#333"/>
  <circle cx="28.5" cy="25.5" r="0.5" fill="#fff"/>
  <circle cx="36.5" cy="25.5" r="0.5" fill="#fff"/>
  
  <!-- Focused eyebrows -->
  <path d="M26 24 L30 23" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M34 23 L38 24" stroke="#333" stroke-width="1" fill="none"/>
  
  <!-- Nose -->
  <ellipse cx="32" cy="29" rx="1" ry="1.5" fill="#f4a460"/>
  
  <!-- Mouth -->
  <path d="M29 32 Q32 33 35 32" stroke="#333" stroke-width="1" fill="none"/>
  
  <!-- Body/Tunic -->
  <rect x="24" y="38" width="16" height="22" rx="2" fill="#228b22"/>
  
  <!-- Leather vest -->
  <rect x="26" y="40" width="12" height="16" rx="1" fill="#8b4513" stroke="#654321" stroke-width="1"/>
  
  <!-- Bow -->
  <path d="M45 35 Q48 45 45 55" stroke="#8b4513" stroke-width="3" fill="none"/>
  <line x1="45" y1="35" x2="45" y2="55" stroke="#333" stroke-width="1"/>
  
  <!-- Arrow -->
  <line x1="42" y1="45" x2="48" y2="45" stroke="#8b4513" stroke-width="2"/>
  <polygon points="48,45 50,44 50,46" fill="#c0c0c0"/>
  <path d="M42 45 L40 43 L40 47 Z" fill="#228b22"/>
  
  <!-- Quiver -->
  <rect x="18" y="42" width="4" height="12" rx="2" fill="#8b4513" stroke="#654321" stroke-width="1"/>
  <line x1="19" y1="40" x2="19" y2="44" stroke="#654321" stroke-width="1"/>
  <line x1="20" y1="40" x2="20" y2="44" stroke="#654321" stroke-width="1"/>
  <line x1="21" y1="40" x2="21" y2="44" stroke="#654321" stroke-width="1"/>
  
  <!-- Arms -->
  <ellipse cx="20" cy="48" rx="3" ry="6" fill="#fdbcb4"/>
  <ellipse cx="44" cy="48" rx="3" ry="6" fill="#fdbcb4"/>
  
  <!-- Hands -->
  <circle cx="20" cy="52" r="2.5" fill="#fdbcb4"/>
  <circle cx="44" cy="52" r="2.5" fill="#fdbcb4"/>
  
  <!-- Target symbol on tunic -->
  <circle cx="32" cy="48" r="3" fill="none" stroke="#ffd700" stroke-width="1"/>
  <circle cx="32" cy="48" r="1.5" fill="none" stroke="#ffd700" stroke-width="1"/>
  <circle cx="32" cy="48" r="0.5" fill="#ffd700"/>
