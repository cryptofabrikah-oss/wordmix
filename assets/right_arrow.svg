<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Seta direita estilo 8-16 bits Super Nintendo -->
  <defs>
    <style>
      .arrow-dark { fill: #2c2c54; }
      .arrow-medium { fill: #40407a; }
      .arrow-light { fill: #706fd3; }
      .arrow-highlight { fill: #f7f1e3; }
    </style>
  </defs>
  
  <!-- Corpo principal da seta -->
  <rect x="8" y="14" width="16" height="4" class="arrow-medium"/>
  
  <!-- Ponta da seta -->
  <rect x="24" y="12" width="2" height="2" class="arrow-medium"/>
  <rect x="24" y="18" width="2" height="2" class="arrow-medium"/>
  <rect x="26" y="14" width="2" height="4" class="arrow-medium"/>
  
  <!-- Sombra inferior -->
  <rect x="8" y="17" width="16" height="1" class="arrow-dark"/>
  <rect x="24" y="17" width="2" height="1" class="arrow-dark"/>
  <rect x="26" y="17" width="2" height="1" class="arrow-dark"/>
  
  <!-- Highlight superior -->
  <rect x="8" y="14" width="16" height="1" class="arrow-light"/>
  <rect x="24" y="12" width="2" height="1" class="arrow-light"/>
  <rect x="26" y="14" width="2" height="1" class="arrow-light"/>
  
  <!-- Brilho pixel art -->
  <rect x="22" y="15" width="1" height="1" class="arrow-highlight"/>
  <rect x="26" y="15" width="1" height="1" class="arrow-highlight"/>
</svg>